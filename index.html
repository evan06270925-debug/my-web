    <style>
        body {
            font-family: 'Noto Sans TC', 'Fredoka', sans-serif;
            background-color: #fffbeb;
            background-image: radial-gradient(#fde68a 1.5px, transparent 1.5px);
            background-size: 24px 24px;
        }

        /* 飄浮背景爪印動畫 */
        .floating-paw {
            position: fixed;
            pointer-events: none;
            opacity: 0.15;
            animation: floatUp 12s infinite linear;
            z-index: 0;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            20% { opacity: 0.2; }
            80% { opacity: 0.2; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        /* 卡片懸停立體效果 */
        .dog-card {
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .dog-card:hover {
            transform: translateY(-8px) scale(1.01);
            box-shadow: 0 20px 30px -10px rgba(217, 119, 6, 0.2);
        }

        /* 噴發愛心顆粒動畫 */
        .particle-heart {
            position: absolute;
            pointer-events: none;
            animation: heartBurst 0.8s ease-out forwards;
            font-size: 1.5rem;
            z-index: 30;
        }

        @keyframes heartBurst {
            0% { opacity: 1; transform: translate(0, 0) scale(0.5) rotate(0deg); }
            100% { opacity: 0; transform: translate(var(--tw-translate-x), var(--tw-translate-y)) scale(1.5) rotate(var(--tw-rotate)); }
        }

        /* 自訂 Toast 提示動畫 */
        .toast-enter {
            animation: slideUp 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .toast-exit {
            animation: fadeOutDown 0.3s ease-in forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translate(-50%, 100%); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }
        @keyframes fadeOutDown {
            from { opacity: 1; transform: translate(-50%, 0); }
            to { opacity: 0; transform: translate(-50%, 100%); }
        }

        /* Modal 動畫 */
        .modal-bg {
            transition: opacity 0.3s ease;
        }
        .modal-content {
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
        }
    </style>
</head>

        // --- 1. Web Audio API 音效合成器 (不需加載外部 mp3) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'pet') {
                // 可愛的高音 Pop 聲
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'treat') {
                // 叮噹兩聲雙音
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.setValueAtTime(659.25, now + 0.08); // E5
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            }
        }

            }
        ];

        let currentFilter = 'all';

        // 3. 渲染狗狗卡片列表
        function renderDogs() {
            const grid = document.getElementById('dog-grid');
            const noResults = document.getElementById('no-results');
            const searchKeyword = document.getElementById('search-input').value.trim().toLowerCase();

            grid.innerHTML = '';

            const filtered = dogsData.filter(dog => {
                const matchesFilter = (currentFilter === 'all') || dog.tags.includes(currentFilter);
                const matchesSearch = dog.name.toLowerCase().includes(searchKeyword) || 
                                      dog.breed.toLowerCase().includes(searchKeyword) ||
                                      dog.intro.toLowerCase().includes(searchKeyword);
                return matchesFilter && matchesSearch;
            });

            if (filtered.length === 0) {
                noResults.classList.remove('hidden');
            } else {
                noResults.classList.add('hidden');
                
                filtered.forEach(dog => {
                    const card = document.createElement('div');
                    card.className = 'dog-card bg-white rounded-3xl overflow-hidden shadow-md border-2 border-amber-100 flex flex-col h-full relative';
                    
                    card.innerHTML = `
                        <!-- 頂部頭像圖片區 -->
                        <div class="h-48 bg-gradient-to-br ${dog.bgGradient} p-4 flex items-center justify-center relative overflow-hidden group cursor-pointer" onclick="openModal('${dog.id}')">
                            <div class="w-32 h-32 transform group-hover:scale-110 transition-transform duration-300 drop-shadow-md">
                                ${dog.avatarSvg}
                            </div>
                            <span class="absolute top-3 right-3 ${dog.badgeBg} text-white text-xs font-bold px-3 py-1 rounded-full shadow-sm">
                                ${dog.badgeText}
                            </span>
                        </div>

                        <!-- 卡片內容區 -->
                        <div class="p-5 flex flex-col flex-grow">
                            <div class="flex items-baseline justify-between mb-1">
                                <h3 class="text-xl font-bold text-gray-800">${dog.name}</h3>
                                <span class="text-xs text-amber-700 bg-amber-50 px-2 py-0.5 rounded-md font-medium border border-amber-200">${dog.breed}</span>
                            </div>

                            <p class="text-gray-600 text-sm leading-relaxed mb-4 flex-grow">
                                "${dog.intro}"
                            </p>

                            <!-- 按鈕操作區 -->
                            <div class="pt-3 border-t border-gray-100 flex flex-col gap-2 mt-auto">
                                <div class="flex items-center justify-between gap-2">
                                    <button onclick="petDog('${dog.name}', '${dog.breed}')" class="flex-1 bg-amber-500 hover:bg-amber-600 text-white font-bold py-2 px-3 rounded-xl text-sm transition-colors flex items-center justify-center gap-1 shadow-sm active:scale-95">
                                        <span>👋</span> 摸摸我
                                    </button>
                                    <button onclick="giveTreat(event, '${dog.id}')" class="flex-1 bg-rose-500 hover:bg-rose-600 text-white font-bold py-2 px-3 rounded-xl text-sm transition-colors flex items-center justify-center gap-1 shadow-sm active:scale-95">
                                        <span>罐罐</span> <span id="treat-count-${dog.id}">${dog.treats}</span>
                                    </button>
                                </div>
                                <button onclick="openModal('${dog.id}')" class="w-full bg-amber-50 hover:bg-amber-100 text-amber-800 font-semibold py-1.5 rounded-xl text-xs transition-colors border border-amber-200">
                                    查看完整詳細小檔案 📊
                                </button>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            }
        }

        // 4. 篩選與搜尋處理
        function setFilter(tag) {
            currentFilter = tag;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active', 'bg-amber-500', 'text-white');
                btn.classList.add('bg-amber-100', 'text-amber-800');
            });
            event.currentTarget.classList.add('active', 'bg-amber-500', 'text-white');
            event.currentTarget.classList.remove('bg-amber-100', 'text-amber-800');
            renderDogs();
        }

        function filterDogs() {
            renderDogs();
        }

        // 5. 摸摸互動 (Toast + 音效)
        function petDog(name, breed) {
            playSound('pet');
            const reactions = [
                '開心得瘋狂搖尾巴！ 🐕💨',
                '舒服到露出了爽快的表情！ 😌',
                '興奮地在你腳邊繞圈圈～ 🌀',
                '輕咬你的手套跟你撒嬌 ❤️',
                '開心地汪了一聲表達感謝！ 🐶🎵'
            ];
            const randomReaction = reactions[Math.floor(Math.random() * reactions.length)];
            
            showToast(`你摸了 <b>${name}</b> (${breed})<br><span class="text-amber-200 text-xs">${randomReaction}</span>`);
        }

        // 6. 送罐罐互動 (粒子特效 + 音效 + 計數)
        function giveTreat(event, dogId) {
            playSound('treat');
            const dog = dogsData.find(d => d.id === dogId);
            if (!dog) return;

            dog.treats += 1;
            document.getElementById(`treat-count-${dogId}`).innerText = dog.treats;

            // 更新總計數
            const totalTreats = dogsData.reduce((sum, item) => sum + item.treats, 0);
            document.getElementById('total-treats-count').innerText = `${totalTreats} 個`;

            // 生成噴發愛心粒子特效
            createBurstEffect(event);

            showToast(`成功餵食 <b>${dog.name}</b> 一個香噴噴罐罐 🥫！`);
        }

        function createBurstEffect(e) {
            const button = e.currentTarget;
            const rect = button.getBoundingClientRect();
            
            for (let i = 0; i < 6; i++) {
                const heart = document.createElement('div');
                heart.className = 'particle-heart';
                heart.innerText = ['💖', '🥫', '✨', '🐾'][Math.floor(Math.random() * 4)];
                
                const tx = (Math.random() - 0.5) * 120 + 'px';
                const ty = - (Math.random() * 80 + 40) + 'px';
                const rot = (Math.random() - 0.5) * 60 + 'deg';

                heart.style.setProperty('--tw-translate-x', tx);
                heart.style.setProperty('--tw-translate-y', ty);
                heart.style.setProperty('--tw-rotate', rot);
                heart.style.left = (rect.left + rect.width / 2) + 'px';
                heart.style.top = (rect.top + rect.height / 2) + 'px';

                document.body.appendChild(heart);

                setTimeout(() => heart.remove(), 800);
            }
        }

        // 7. Modal 彈窗與詳細能力評分
        function openModal(dogId) {
            playSound('pet');
            const dog = dogsData.find(d => d.id === dogId);
            if (!dog) return;

            const modalBody = document.getElementById('modal-body');
            modalBody.innerHTML = `
                <div class="text-center mb-4">
                    <div class="w-28 h-28 mx-auto bg-gradient-to-br ${dog.bgGradient} rounded-full p-3 shadow-inner mb-2">
                        ${dog.avatarSvg}
                    </div>
                    <h2 class="text-2xl font-black text-gray-800">${dog.name}</h2>
                    <p class="text-xs text-amber-700 font-bold">${dog.breed}</p>
                </div>

                <!-- 能力值指標量表 -->
                <div class="bg-amber-50 p-4 rounded-2xl mb-4 space-y-2 text-xs font-bold text-gray-700">
                    <div class="text-amber-900 font-black mb-2 text-sm">📊 狗狗性格能力值：</div>
                    <div>
                        <div class="flex justify-between mb-1"><span>可愛指數 ❤️</span><span>${dog.stats.cuteness}%</span></div>
                        <div class="w-full bg-amber-200 h-2 rounded-full overflow-hidden">
                            <div class="bg-rose-500 h-full rounded-full" style="width: ${dog.stats.cuteness}%"></div>
                        </div>
                    </div>
                    <div>
                        <div class="flex justify-between mb-1"><span>精力充沛度 ⚡</span><span>${dog.stats.energy}%</span></div>
                        <div class="w-full bg-amber-200 h-2 rounded-full overflow-hidden">
                            <div class="bg-amber-500 h-full rounded-full" style="width: ${dog.stats.energy}%"></div>
                        </div>
                    </div>
                    <div>
                        <div class="flex justify-between mb-1"><span>智商指數 🧠</span><span>${dog.stats.intelligence}%</span></div>
                        <div class="w-full bg-amber-200 h-2 rounded-full overflow-hidden">
                            <div class="bg-blue-500 h-full rounded-full" style="width: ${dog.stats.intelligence}%"></div>
                        </div>
                    </div>
                </div>

                <!-- 飼養小貼士 -->
                <div class="bg-emerald-50 border border-emerald-200 p-3.5 rounded-2xl text-xs text-emerald-900">
                    <span class="font-bold block mb-1">💡 照顧小叮嚀：</span>
                    ${dog.tips}
                </div>
            `;

            const modal = document.getElementById('dog-modal');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            modal.querySelector('.modal-content').classList.remove('scale-90');
            modal.querySelector('.modal-content').classList.add('scale-100');
        }

        function closeModal() {
            const modal = document.getElementById('dog-modal');
            modal.classList.add('opacity-0', 'pointer-events-none');
            modal.querySelector('.modal-content').classList.remove('scale-100');
            modal.querySelector('.modal-content').classList.add('scale-90');
        }

        // 8. 自訂 Toast 提示
        function showToast(htmlContent) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'bg-gray-900/90 text-white text-sm px-4 py-3 rounded-2xl shadow-xl toast-enter border border-white/10 backdrop-blur-md flex items-center gap-2 pointer-events-auto';
            toast.innerHTML = `<div>🐾</div><div>${htmlContent}</div>`;

            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('toast-enter');
                toast.classList.add('toast-exit');
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        // 初始化繪製
        window.onload = function() {
            renderDogs();
        };
    </script>
</body>
</html>
